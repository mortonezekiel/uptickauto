<header class="masthead">
  <div class="wrap masthead__bar">
    <a class="brand" href="{{ u('') }}" aria-label="{{ site.name }} home">
      <svg class="brand__mark" viewBox="0 0 32 32" width="34" height="34" aria-hidden="true" focusable="false"><rect class="brand__badge" width="32" height="32" rx="8"/><path class="brand__tick" d="M7 21.5 12.5 16l4 3.5 8-9.5" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle class="brand__dot" cx="24.5" cy="10" r="2.6"/></svg>
      <span class="brand__name">{{ site.name }}</span>
    </a>
    <p class="masthead__date"><time datetime="{{ iso(updated_at) }}">{{ masthead_date }}</time></p>
  </div>
  <nav class="topics" aria-label="Topics">
    <div class="wrap">
      <ul class="topics__list">
        <li><a href="{{ u('') }}"{% if active == 'home' %} aria-current="page"{% endif %}>Top stories</a></li>
        {% for c in cats %}
        <li><a href="{{ u('category/' ~ c.slug ~ '/') }}"{% if active == c.slug %} aria-current="page"{% endif %}>{{ c.name }}</a></li>
        {% endfor %}
      </ul>
    </div>
  </nav>
</header>
